<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="GitHub stats"><title>GitHub stats</title><style>
text{font-family:'Trebuchet MS','Verdana','Helvetica Neue',Arial,sans-serif;font-weight:800}
.float{animation:float 5s ease-in-out infinite}
.f2{animation-duration:6.5s;animation-delay:-1.5s}
.f3{animation-duration:4s;animation-delay:-2.5s}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
